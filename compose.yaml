services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vhal-backend-app

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - vhal-network


  nginx:
    image: nginx:alpine

    container_name: vhal-backend-nginx

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - vhal-network


  mysql:
    image: mysql:8.4

    container_name: vhal-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: vhal
      MYSQL_USER: vhal
      MYSQL_PASSWORD: vhal_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password

    ports:
      - "3307:3306"

    volumes:
      - vhal-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot_dev_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - vhal-network


  phpmyadmin:
    image: phpmyadmin:latest

    container_name: vhal-phpmyadmin

    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - vhal-network


networks:
  vhal-network:
    driver: bridge


volumes:
  vhal-mysql-data: